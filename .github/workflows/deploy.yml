name: deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install pytest
      - name: Unit tests (no API key)
        run: python -m pytest evaluation/ -q
      - name: Pull LFS files
        # data/chroma/ and data/repertory.db are committed via LFS (see
        # .gitattributes), so this brings in the real prebuilt index --
        # no need to rebuild it here.
        run: git lfs pull
      - name: Smoke eval
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m evaluation.run_eval --repeats 1

  cd:
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true               # pull real blobs (chroma/repertory/out), not just pointers
      - name: Push to HF Space
        # HF Space is a deploy target, not a source-history archive: push a
        # single squashed commit of the current tree instead of full main
        # history. Full history still carries earlier commits where
        # data/chroma + repertory.db were plain (non-LFS) blobs, which trips
        # HF's 10MiB-per-file limit even though HEAD is clean.
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git checkout --orphan hf-deploy
          git -c user.name="deploy-bot" -c user.email="deploy-bot@users.noreply.github.com" \
            commit -m "Deploy ${GITHUB_SHA}"
          git push https://user:$HF_TOKEN@huggingface.co/spaces/pragya6/homoeo-quiz hf-deploy:main --force
