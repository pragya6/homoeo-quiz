name: deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install pytest
      - name: Unit tests (no API key)
        run: python -m pytest evaluation/ -q
      - name: Build index
        # data/chroma/ and data/repertory.db are gitignored (built at runtime,
        # not committed -- see app.py::ensure_index), so CI has to build them
        # too before anything that retrieves can run. No API calls; local
        # embedding only.
        run: git lfs pull
        run: python -c "from app import ensure_index; ensure_index()"
      - name: Smoke eval
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m evaluation.run_eval --repeats 1

  cd:
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          lfs: true               # pull real out/*.json blobs, not just pointers
      - name: Push to HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: git push https://user:$HF_TOKEN@huggingface.co/spaces/pragya6/homoeo-quiz main --force
