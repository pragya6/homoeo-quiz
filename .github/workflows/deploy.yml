name: ci-cd
on:
  push: { branches: [main] }
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.13" }
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest
      - name: Run tests
        run: python -m pytest evaluation/ -q
      - env: { GEMINI_API_KEY: "${{ secrets.GEMINI_API_KEY }}" }
        run: python -m evaluation.run_eval --sample 15 --repeats 1   # smoke eval
  cd:
    needs: ci                                          # only if CI is green
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - env: { HF_TOKEN: "${{ secrets.HF_TOKEN }}" }
        run: |
          git push https://user:$HF_TOKEN@huggingface.co/spaces/pragya6/homeo-quiz main --force